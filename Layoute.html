<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 05 - Layout Flexbox</title>
    <link rel="stylesheet" href="/css/{ } layoute.css">
</head>
<body>

    <h2>Layout Pertama</h2>

    <div class="container layout-satu">

        <nav class="nav">
            <h3>Nav</h3>
            <p>Menu Navigasi</p>
        </nav>

        <div class="konten-satu">

            <header class="header">
                <h3>Header</h3>
            </header>

            <div class="tengah">

                <article class="article">
                    <h3>Article</h3>
                    <p>Bagian utama halaman web.</p>
                </article>

                <aside class="aside">
                    <h3>Aside</h3>
                    <p>Konten tambahan.</p>
                </aside>

            </div>

            <footer class="footer">
                <h3>Footer</h3>
            </footer>

        </div>
    </div>


    <h2>Layout Kedua</h2>

    <div class="container layout-dua">

        <header class="header">
            <h3>Header</h3>
        </header>

        <div class="bagian-tengah">

            <aside class="aside-dua">
                <h3>Aside</h3>
                <p>Menu samping.</p>
            </aside>

            <article class="article-dua">
                <h3>Article</h3>
                <p>Galeri gambar:</p>

                <div class="galeri">
                    <img src="/img/burung1.png">
                    <img src="/img/burung2.png">
                    <img src="/img/burung3.png">
                </div>

            </article>

        </div>

        <footer class="footer">
            <h3>Footer</h3>
        </footer>

    </div>

</body>
  </html>
